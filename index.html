<!DOCTYPE html>

<html>
  <head>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;1,100;1,200&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="postits-container"></div>
    <div class="card">
      <h1>Mi empolvado ❤️ ...</h1>
      <p>¿Quieres ser mi Valentine?</p>
      <div class=" image-box">
        <img id="sweetstitch" src="./images/stitch.png" class = "logo" alt="stitch">
      </div>
      <div class="buttons">
        <button id="yesbutton" class="btn yes">Sí 💖</button>
        <button id="nobutton" class="btn no">No 💔</button>
      </div>
    </div>
    <script>
      const noBtn = document.getElementById("nobutton");
      const yesBtn = document.getElementById("yesbutton");
      const mainImage = document.getElementById("sweetstitch");

      noBtn.addEventListener("mouseenter", () => {
        const x = Math.random() * 1100- 800;
        const y = Math.random() * 300 - 150;

        noBtn.style.transform = `translate(${x}px, ${y}px)`;
        mainImage.src = "./images/upset_stitch.png";
      });

      yesBtn.addEventListener("mouseenter", () => {
        mainImage.src = "./images/stitch.png";
      });
      yesBtn.addEventListener("click", () => {
        document.querySelector(".card").innerHTML = `
          <h1 class="htittle">¡¡Gracias por elegirme una vez más... !!🙈💖</h1>
          <img src="./images/stitch_kiss.gif" class="gif" alt="happy">
          <p class="title">Te amo mucho mi principe💘</p>
          <p class="title">Feliz San Valentín 💌</p>
          
        `;
      });
      const postitsContainer = document.getElementById("postits-container");

      const colors = [
        "#fff3a0",  // amarillo post-it
        "#ffd6e8",  // rosado
        "#d6f5ff",  // celeste
        "#e6d6ff"   // lila
      ];

      for (let i = 0; i < 500; i++) {
        const note = document.createElement("div");
        const dx = (Math.random() * 40 - 20) + "px";
        const dy = (Math.random() * -40 - 10) + "px";
        const duration = (Math.random() * 6 + 4) + "s";
        const delay = (Math.random() * 5) + "s";

        note.style.setProperty("--dx", dx);
        note.style.setProperty("--dy", dy);
        note.style.animationDuration = duration;
        note.style.animationDelay = delay;

        note.classList.add("postit");
        note.textContent = "Te Amo 💘";

        const x = Math.random() * window.innerWidth;
        const y = Math.random() * window.innerHeight;
        const rot = (Math.random() * 20 - 10) + "deg";
        const color = colors[Math.floor(Math.random() * colors.length)];

        note.style.left = x + "px";
        note.style.top = y + "px";
        note.style.setProperty("--rot", rot);
        note.style.background = color;

        postitsContainer.appendChild(note);
      }
    </script>
  </body>
</html>
